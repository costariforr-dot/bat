<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bat Mitzvah 2026 - Guiones</title>
    <!-- Tailwind CSS para el diseño rápido y adaptativo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos adicionales para asegurar que se vea como una app móvil */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6; /* gray-100 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 28rem; /* 448px, tamaño maximo de un celular ancho */
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        
        <!-- PANTALLA DE INICIO (HOME) -->
        <div id="home-screen" class="flex flex-col min-h-screen bg-pink-50">
            <div class="bg-pink-600 p-8 text-center text-white rounded-b-3xl shadow-md">
                <!-- Icono de Estrella -->
                <svg class="w-12 h-12 mx-auto mb-3 text-pink-200" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <h1 class="text-3xl font-extrabold tracking-tight">Bat Mitzvah 2026</h1>
                <p class="text-pink-100 mt-2 text-lg opacity-90">App de Guiones</p>
            </div>
            
            <div class="p-6 flex-grow flex flex-col pb-10">
                <h2 class="text-center text-gray-600 font-medium mb-6 text-lg">
                    Elige tu nombre para empezar:
                </h2>
                <div class="grid grid-cols-2 gap-4" id="girls-grid">
                    <!-- Los botones de las niñas se generarán aquí con JavaScript -->
                </div>
            </div>
        </div>

        <!-- PANTALLA DEL GUION (SCRIPT) -->
        <div id="script-screen" class="hidden flex-col min-h-screen">
            <!-- Cabecera pegajosa (Sticky Header) -->
            <header class="sticky top-0 bg-pink-600 text-white p-4 flex items-center justify-between z-20 shadow-lg pb-5 rounded-b-2xl">
                <button id="btn-back" class="flex items-center text-white bg-pink-700 hover:bg-pink-800 px-3 py-1.5 rounded-full transition-colors font-medium shadow-inner">
                    <!-- Icono volver -->
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                    Volver
                </button>
                <div class="font-bold flex items-center gap-2 text-lg mr-2">
                    <!-- Icono usuario -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span id="selected-girl-name">Nombre</span>
                </div>
            </header>

            <!-- Contenido del guion -->
            <main class="flex-grow pb-16 pt-2" id="script-content">
                <!-- El guion se generará aquí -->
            </main>
        </div>

    </div>

            { type: 'line', speaker: 'Amelie', text: 'Invito a mi bisabuelo el Dr. Salomon Fachler quien fue salvado de la guerra por mi bisabuelo Shulem Fachler Z”L a prender esta vela en recuerdo de todas las victimas del holocausto.' },

                {es: "Amru et ze kodem lefanay", he: "אָמְרוּ אֶת זֶה קוֹדֶם לְפָנַי"},
                {es: "Lo meshane - ani ve'ata neshane et ha'olam", he: "לֹא מְשַׁנֶּה - אֲנִי וְאַתָּה נְשַׁנֶּה אֶת הָעוֹלָם"},
                {es: "Ani ve'ata nenase me'hatjala", he: "אֲנִי וְאַתָּה נְנַסֶּה מֵהַתְחָלָה"},

                {es: "Amru et ze kodem lefanay", he: "אָמְרוּ אֶת זֶה קוֹדֶם לְפָנַי"},

            { type: 'action', text: 'XXX: Despedida final ("Muchas gracias por acompañarnos...").' }

        // LÓGICA DE LA APP
        const homeScreen = document.getElementById('home-screen');
        const scriptScreen = document.getElementById('script-screen');
        const girlsGrid = document.getElementById('girls-grid');
        const scriptContent = document.getElementById('script-content');
        const btnBack = document.getElementById('btn-back');
        const selectedGirlName = document.getElementById('selected-girl-name');

        let selectedGirl = null;

        // Generar botones de niñas
        girlsList.forEach(girl => {
            const btn = document.createElement('button');
            btn.className = "bg-white border-2 border-pink-100 text-pink-700 font-bold p-4 rounded-2xl shadow-sm hover:bg-pink-50 hover:border-pink-300 active:bg-pink-200 transition-all flex flex-col items-center gap-3";
            btn.innerHTML = `
                <div class="w-14 h-14 bg-pink-100 rounded-full flex items-center justify-center text-pink-500 shadow-inner">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <span class="text-lg">${girl}</span>
            `;
            btn.onclick = () => selectGirl(girl);
            girlsGrid.appendChild(btn);
        });

        // Seleccionar una niña
        function selectGirl(girl) {
            selectedGirl = girl;
            selectedGirlName.textContent = girl;
            homeScreen.classList.add('hidden');
            homeScreen.classList.remove('flex');
            scriptScreen.classList.remove('hidden');
            scriptScreen.classList.add('flex');
            window.scrollTo(0, 0);
            renderScript();
        }

        // Volver al inicio
        btnBack.onclick = () => {
            selectedGirl = null;
            scriptScreen.classList.add('hidden');
            scriptScreen.classList.remove('flex');
            homeScreen.classList.remove('hidden');
            homeScreen.classList.add('flex');
        };

        // Renderizar el guion
        function renderScript() {
            let html = '';
            let waitingQueue = [];

            const flushWaiting = () => {
                if (waitingQueue.length > 0) {
                    html += `
                        <div class="mx-4 my-3 p-3 bg-gray-50 rounded-xl border border-gray-200 flex items-start gap-3 text-sm text-gray-500 shadow-sm">
                            <svg class="w-5 h-5 flex-shrink-0 text-gray-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="italic leading-relaxed">
                                <strong>Esperas a que hablen:</strong> ${waitingQueue.join(', ')}.
                            </span>
                        </div>
                    `;
                    waitingQueue = [];
                }
            };

            scriptData.forEach((item, index) => {
                if (item.type === 'line') {
                    if (item.speaker === selectedGirl) {
                        flushWaiting();
                        html += `
                            <div class="mx-4 my-6 p-5 bg-pink-50 border-l-8 border-pink-500 rounded-r-2xl shadow-md transform transition-all">
                                <div class="font-extrabold text-pink-700 mb-2 flex items-center gap-2">
                                    <svg class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    ${item.speaker.toUpperCase()} (¡TU TURNO!)
                                </div>
                                <div class="text-xl font-medium text-gray-900 leading-snug">
                                    "${item.text}"
                                </div>
                            </div>
                        `;
                    } else if (item.speaker === 'TODAS') {
                        flushWaiting();
                        html += `
                            <div class="mx-4 my-6 p-5 bg-purple-50 border-l-8 border-purple-500 rounded-r-2xl shadow-md">
                                <div class="font-extrabold text-purple-700 flex items-center gap-2 mb-2">
                                    <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                    TODAS JUNTAS
                                </div>
                                <div class="text-xl font-bold text-purple-900 leading-snug">
                                    "${item.text}"
                                </div>
                            </div>
                        `;
                    } else {
                        waitingQueue.push(item.speaker);
                    }
                } else {
                    flushWaiting();
                    
                    if (item.type === 'header') {
                        html += `
                            <div class="mt-10 mb-4 px-4">
                                <h3 class="font-black text-pink-800 text-xl border-b-2 border-pink-200 pb-2 uppercase tracking-wide">
                                    ${item.text}
                                </h3>
                            </div>
                        `;
                    } else if (item.type === 'action') {
                        html += `
                            <div class="mx-4 my-3 text-base text-gray-600 bg-gray-100 p-3 rounded-lg italic border border-gray-200">
                                ${item.text}
                            </div>
                        `;
                    } else if (item.type === 'song') {
                        let linesHtml = item.lines.map(line => `
                            <div class="flex flex-col items-center bg-white p-3 rounded-xl shadow-sm">
                                <span class="font-medium text-blue-900 text-center text-lg">${line.es}</span>
                                ${line.he ? `<span class="text-blue-700 font-serif text-2xl mt-1 text-center font-bold" dir="rtl">${line.he}</span>` : ''}
                            </div>
                        `).join('');

                        html += `
                            <div class="mx-4 my-8 bg-blue-50 rounded-2xl overflow-hidden shadow-md border border-blue-200">
                                <div class="bg-blue-500 text-white p-3 font-bold text-base flex items-center justify-center gap-2 shadow-sm">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                                    ${item.title}
                                </div>
                                <div class="p-5 flex flex-col gap-4">
                                    ${linesHtml}
                                </div>
                            </div>
                        `;
                    }
                }
            });

            flushWaiting();
            scriptContent.innerHTML = html;
        }
    </script>
</body>
</html>
